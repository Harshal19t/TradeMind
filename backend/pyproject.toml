[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harshal19t", email = "harshal1901@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deepeval>=4.3.4",
    "fastapi>=0.162.5",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pinecone-client>=6.0.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "supabase>=2.34.1",
    "uvicorn>=0.54.0",
    "yfinance>=1.8.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
